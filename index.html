<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake vs Rat Game</title>
    <style>
        body {
            background-color: #FCE7F3; /* Light Magenta Background */
            color: #1E293B;            /* Dark Slate Text */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        h1 {
            font-size: 48px; 
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #2563EB;        /* Blue Headline */
        }

        #ui-container {
            display: flex;
            align-items: center;
            gap: 40px; 
            margin-bottom: 20px;
        }

        #score-board {
            font-size: 30px; 
            font-weight: 800;
            color: #1E293B;
        }

        #score {
            color: #2563EB;        
        }

        #game-container {
            position: relative;
        }

        canvas {
            background-color: #0f172a; /* Extra deep dark slate for strong game grid contrast */
            border: 6px solid #14B8A6; /* Thickened Teal Border */
            box-shadow: 0 15px 35px rgba(30, 41, 59, 0.25);
            width: 600px;
            height: 600px;
        }

        /* On-Screen Arrow Controls Grid */
        #controls-container {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(2, 70px);
            gap: 10px;
            margin-top: 25px;
            justify-content: center;
        }

        .dpad-btn {
            background-color: #14B8A6; /* Secondary Teal color */
            color: #F8FAFC;
            border: none;
            border-radius: 12px;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-shadow: 0 5px 0px #0d8578, 0 6px 10px rgba(0,0,0,0.15);
            transition: transform 0.05s, box-shadow 0.05s;
        }

        .dpad-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0px #0d8578, 0 2px 4px rgba(0,0,0,0.15);
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        /* Overlay screens for Start, Pause, and Game Over */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.96); /* Deep slate semi-transparent mask */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-over-screen {
            display: none;
        }

        #pause-screen {
            display: none;
            background: rgba(15, 23, 42, 0.90);
        }

        .overlay-screen h2 {
            font-size: 52px; 
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        #start-screen h2 { color: #2563EB; }     
        #game-over-screen h2 { color: #ef4444; }  
        #pause-screen h2 { color: #14B8A6; }      

        .overlay-screen p {
            font-size: 22px; 
            margin-bottom: 30px;
            color: #F8FAFC;            
            opacity: 0.95;
            line-height: 1.5;
        }

        /* Main Buttons (Primary Theme color) */
        button {
            padding: 15px 35px; 
            font-size: 22px;    
            background-color: #2563EB; 
            color: #F8FAFC;            
            border: none;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s, transform 0.1s;
            font-weight: 800;
            box-shadow: 0 5px 10px rgba(37, 99, 235, 0.3);
        }

        button:hover {
            background-color: #1d4ed8;
            transform: scale(1.04);
        }

        /* Action Controls (Accent color) */
        #pause-btn {
            background-color: #F97316; 
            color: #F8FAFC;
            padding: 10px 28px; 
            font-size: 20px;    
            box-shadow: 0 5px 10px rgba(249, 115, 22, 0.3);
            border-radius: 6px;
        }

        #pause-btn:hover {
            background-color: #ea580c;
        }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    
    <div id="ui-container">
        <div id="score-board">Score: <span id="score">0</span></div>
        <button id="pause-btn" onclick="togglePause()">Pause</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="1200" height="1200"></canvas>

        <div id="start-screen" class="overlay-screen">
            <h2>Ready to Play?</h2>
            <p>Use keyboard keys (Arrow / WASD) or the on-screen buttons below!<br>Press <b>Spacebar</b> to freeze the game.</p>
            <button onclick="startGame()">Start Game</button>
        </div>

        <div id="pause-screen" class="overlay-screen">
            <h2>Game Paused</h2>
            <p>Press Spacebar or click Resume to continue.</p>
            <button onclick="togglePause()">Resume</button>
        </div>

        <div id="game-over-screen" class="overlay-screen">
            <h2>Game Over</h2>
            <p>You bit your tail or hit a wall!</p>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <div id="controls-container">
        <button class="dpad-btn" id="btn-up" onclick="sendDirection('UP')">▲</button>
        <button class="dpad-btn" id="btn-left" onclick="sendDirection('LEFT')">◀</button>
        <button class="dpad-btn" id="btn-down" onclick="sendDirection('DOWN')">▼</button>
        <button class="dpad-btn" id="btn-right" onclick="sendDirection('RIGHT')">▶</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const startScreen = document.getElementById("start-screen");
        const gameOverScreen = document.getElementById("game-over-screen");
        const pauseScreen = document.getElementById("pause-screen");
        const pauseBtn = document.getElementById("pause-btn");

        const gridSize = 40; 
        const tileCount = canvas.width / gridSize; 
        const gameSpeed = 140; 

        let snake = [];
        let rat = { x: 0, y: 0 };
        let dx = gridSize; 
        let dy = 0;        
        let score = 0;
        let gameInterval;
        let changingDirection = false; 
        let isGameRunning = false;
        let isPaused = false;

        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playEatSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'triangle'; 
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); 
            
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playGameOverSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(293.66, audioCtx.currentTime); 
            osc.frequency.linearRampToValueAtTime(110.00, audioCtx.currentTime + 0.5); 
            
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        clearCanvas();

        function startGame() {
            initAudio(); 
            startScreen.style.display = "none";
            isGameRunning = true;
            resetGame();
        }

        function resetGame() {
            snake = [
                { x: gridSize * 10, y: gridSize * 10 },
                { x: gridSize * 9, y: gridSize * 10 },
                { x: gridSize * 8, y: gridSize * 10 }
            ];
            
            dx = gridSize;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            gameOverScreen.style.display = "none";
            pauseScreen.style.display = "none";
            isPaused = false;
            pauseBtn.innerText = "Pause";
            
            spawnRat();
            
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function togglePause() {
            if (!isGameRunning) return;

            if (!isPaused) {
                isPaused = true;
                clearInterval(gameInterval);
                pauseScreen.style.display = "flex";
                pauseBtn.innerText = "Resume";
            } else {
                isPaused = false;
                pauseScreen.style.display = "none";
                pauseBtn.innerText = "Pause";
                gameInterval = setInterval(gameLoop, gameSpeed);
            }
        }

        function gameLoop() {
            if (hasGameEnded()) {
                playGameOverSound();
                gameOverScreen.style.display = "flex";
                clearInterval(gameInterval);
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawRat();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#0f172a"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#60a5fa" : "#2563EB";
                ctx.fillRect(part.x, part.y, gridSize - 4, gridSize - 4); 
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            const hasEatenRat = snake[0].x === rat.x && snake[0].y === rat.y;
            if (hasEatenRat) {
                score += 10;
                scoreElement.innerText = score;
                playEatSound();
                spawnRat();
            } else {
                snake.pop();
            }
        }

        function spawnRat() {
            rat.x = Math.floor(Math.random() * tileCount) * gridSize;
            rat.y = Math.floor(Math.random() * tileCount) * gridSize;

            snake.forEach(part => {
                const hasEaten = part.x === rat.x && part.y === rat.y;
                if (hasEaten) spawnRat();
            });
        }

        function drawRat() {
            ctx.font = `${gridSize - 4}px serif`;
            ctx.textBaseline = "top";
            ctx.textAlign = "left";
            ctx.fillText("🐀", rat.x, rat.y);
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= canvas.width;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= canvas.height;

            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
        }

        // Handle Keyboard inputs
        document.addEventListener("keydown", handleInput);

        function handleInput(event) {
            const keyPressed = event.keyCode;
            const SPACEBAR = 32;

            if (keyPressed === SPACEBAR) {
                event.preventDefault(); 
                togglePause();
                return;
            }

            if (!isGameRunning || isPaused) return; 

            const LEFT = 37,  A = 65;
            const UP = 38,    W = 87;
            const RIGHT = 39, D = 68;
            const DOWN = 40,  S = 83;

            if ((keyPressed === LEFT || keyPressed === A)) sendDirection('LEFT');
            if ((keyPressed === UP || keyPressed === W)) sendDirection('UP');
            if ((keyPressed === RIGHT || keyPressed === D)) sendDirection('RIGHT');
            if ((keyPressed === DOWN || keyPressed === S)) sendDirection('DOWN');
        }

        // Consolidated directional logic processing screen clicks and keyboard key strokes together
        function sendDirection(dir) {
            if (!isGameRunning || isPaused || changingDirection) return;

            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            if (dir === 'LEFT' && !goingRight) {
                dx = -gridSize;
                dy = 0;
                changingDirection = true;
            }
            if (dir === 'UP' && !goingDown) {
                dx = 0;
                dy = -gridSize;
                changingDirection = true;
            }
            if (dir === 'RIGHT' && !goingLeft) {
                dx = gridSize;
                dy = 0;
                changingDirection = true;
            }
            if (dir === 'DOWN' && !goingUp) {
                dx = 0;
                dy = gridSize;
                changingDirection = true;
            }
        }
    </script>
</body>
</html>
